name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.3"
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.14.0"
      - name: Install pinned site toolchain
        run: python -m pip install -r book/requirements-site.txt
      - name: Check language toggle regressions
        run: node scripts/test_lang_toggle.js
      - name: Check repository structure
        run: python scripts/check_consistency.py
      - name: Clean previous build output
        run: jupyter-book clean book --all
      - name: Build site
        run: jupyter-book build book
      - name: Check generated site links
        run: python scripts/check_site.py book/_build/html
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: book/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
