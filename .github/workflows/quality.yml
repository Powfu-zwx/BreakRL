name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.3"
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.14.0"
      - name: Install notebook validator
        run: python -m pip install "nbformat==5.10.4"
      - name: Validate repository consistency
        run: python scripts/check_consistency.py
      - name: Check language toggle regressions
        run: node scripts/test_lang_toggle.js
