name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.3"
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.14.0"
      - name: Install repository validator
        run: python -m pip install "nbformat==5.11.1" "pyyaml==6.0.2"
      - name: Validate repository consistency
        run: python tools/check_repo.py
      - name: Test Colab bootstrap
        run: python tools/test_colab_setup.py
      - name: Check language toggle regressions
        run: node tools/test_lang_toggle.js
