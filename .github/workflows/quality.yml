name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Validate repository consistency
        run: python scripts/check_consistency.py
