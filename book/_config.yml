# Jupyter Book 站点配置。构建：jupyter-book build .（CI 见 .github/workflows/site.yml）
title: BreakRL
author: BreakRL Contributors
copyright: "2026, BreakRL Contributors"
logo: assets/breakrl-wordmark.png
only_build_toc_files: true

execute:
  # 站点只渲染已保存的输出，不重新执行实验
  execute_notebooks: "off"

repository:
  url: https://github.com/Powfu-zwx/BreakRL
  branch: main

html:
  use_repository_button: true

sphinx:
  local_extensions:
    breakrl_locale: scripts
    prepare_site_assets: scripts
  extra_extensions:
    - breakrl_locale
    - prepare_site_assets
  config:
    language: en
    exclude_patterns:
      - ".github/**"
      - "PROJECT_AUDIT.md"
    html_css_files:
      - lang-toggle.css
    html_js_files:
      - lang-toggle.js
