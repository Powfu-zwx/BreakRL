# Jupyter Book 配置。构建：jupyter-book build book
title: BreakRL
author: BreakRL Contributors
copyright: "2026, BreakRL Contributors"
only_build_toc_files: true

execute:
  # 站点只渲染已保存的输出，不重新执行实验
  execute_notebooks: "off"

repository:
  url: https://github.com/Powfu-zwx/BreakRL
  branch: main

html:
  use_repository_button: true
  use_download_button: false
  use_fullscreen_button: false
  home_page_in_navbar: false
  extra_footer: |
    <p class="breakrl-footer">BreakRL is a bilingual, failure-first RL textbook. Text CC BY 4.0. Code MIT.</p>

sphinx:
  local_extensions:
    breakrl_locale: ../scripts
    prepare_site_assets: ../scripts
  extra_extensions:
    - breakrl_locale
    - prepare_site_assets
  config:
    language: en
    exclude_patterns:
      - ".github/**"
      - "PROJECT_AUDIT.md"
    html_css_files:
      - lang-toggle.css
      - breakrl.css
      - breakrl-demo.css
    html_js_files:
      - lang-toggle.js
      - breakrl.js
      - breakrl-demo.js
